name: 🔄 Weekly Exam Data Update

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-exam-data:
    name: Check & Update Exam Data
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev   # always branch off dev, not main

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Run update script ─────────────────────────────────────────────────
      - name: Run weekly exam updater
        id: update
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/update-exams.mjs

      # ── 4. Detect changes ────────────────────────────────────────────────────
      - name: Check if data changed
        id: diff
        run: |
          if git diff --quiet data/exams-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected — will open PR for review."
          fi

      # ── 5. Build PR body from change log ─────────────────────────────────────
      - name: Build PR description
        if: steps.diff.outputs.changed == 'true'
        id: pr_body
        run: |
          LOG=$(cat scripts/.last-update-log.json 2>/dev/null || echo '{}')
          DATE=$(echo $LOG | node -e "const d=require('/dev/stdin');console.log(d.date||'unknown')" 2>/dev/null || echo 'unknown')

          BODY="## 🔄 Weekly Exam Data Update — ${DATE}

          This PR was auto-generated by the weekly data-sync workflow.
          **All changes were detected via Tavily web search + Groq LLM diff check.**

          ---

          ### 📋 What Changed
          \`\`\`json
          $(cat scripts/.last-update-log.json 2>/dev/null || echo '{}')
          \`\`\`

          ---

          ### ✅ Reviewer Checklist (Agile Code Review)
          Before merging, please verify:

          - [ ] Open each changed exam's **official website** and confirm the new date/fee
          - [ ] Cross-check with **careers360.com** or **shiksha.com** as a second source
          - [ ] Ensure no field was incorrectly overwritten (check diff carefully)
          - [ ] If ⚠ NEW EXAMS DETECTED — decide whether to add them manually
          - [ ] Run \`npm run build\` locally to confirm no TypeScript errors
          - [ ] Spot-check the live site after merge to confirm UI renders correctly

          ---

          > 🤖 Auto-generated · Weekly sync · Review before merging to \`dev\`"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 6. Open PR for human review ──────────────────────────────────────────
      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(data): weekly exam data sync — ${{ steps.pr_body.outputs.DATE }}

            Auto-detected changes via Tavily + Groq LLM.
            See PR description for full change log.
          branch: auto/weekly-exam-update
          base: dev
          title: '🔄 Weekly Exam Data Update'
          body: ${{ steps.pr_body.outputs.body }}
          labels: |
            automated
            data-update
            needs-review
          draft: false

      # ── 7. No-op summary if nothing changed ──────────────────────────────────
      - name: Summary (no changes)
        if: steps.diff.outputs.changed == 'false'
        run: echo "✅ All exam data is up to date. No PR needed this week."
