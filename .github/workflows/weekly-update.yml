name: 🔄 Daily Exam Data Update

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 02:00 UTC (02:00 UTC = 07:30 IST)
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-exam-data:
    name: Check & Update Exam Data
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      # ── 2. Node setup ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Run update script ─────────────────────────────────────────────────
      - name: Run weekly exam updater
        env:
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/update-exams.mjs

      # ── 4. Detect data changes ────────────────────────────────────────────────
      - name: Check if data changed
        id: diff
        run: |
          if git diff --quiet data/exams-data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # ── 5. Build PR body from log file (safe — no inline node) ───────────────
      - name: Build PR body file
        if: steps.diff.outputs.changed == 'true'
        run: |
          DATE=$(node -p "require('./scripts/.last-update-log.json').date" 2>/dev/null || echo "unknown")
          CHANGES=$(cat scripts/.last-update-log.json 2>/dev/null || echo "{}")

          cat > /tmp/pr-body.md << 'PREOF'
          ## 🔄 Weekly Exam Data Update
          PREOF

          echo "" >> /tmp/pr-body.md
          echo "**Date:** $DATE" >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "Auto-generated by the weekly sync workflow. Changes detected via Tavily web search + Groq LLM diff." >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "---" >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "### 📋 Change Log" >> /tmp/pr-body.md
          echo '```json' >> /tmp/pr-body.md
          echo "$CHANGES" >> /tmp/pr-body.md
          echo '```' >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "---" >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          cat >> /tmp/pr-body.md << 'CHECKEOF'
          ### ✅ Reviewer Checklist (required before merge)

          **Data Accuracy**
          - [ ] Verified each changed date/fee on the exam's **official website**
          - [ ] Cross-checked with careers360.com or shiksha.com as a second source
          - [ ] Reviewed the full diff — no field was incorrectly overwritten
          - [ ] `lastUpdated` in JSON reflects today's date

          **New Exams (if flagged)**
          - [ ] Reviewed any ⚠ NEW EXAMS DETECTED entries
          - [ ] Decision noted in comment below (add / skip + reason)

          **Technical**
          - [ ] `npm run build` passes with no errors
          - [ ] JSON is valid (no syntax errors)
          - [ ] Spot-checked Vercel preview before approving

          ---

          > 🤖 Auto-generated · Do not merge without completing the checklist
          CHECKEOF

      # ── 6. Open PR for human review ──────────────────────────────────────────
      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore(data): weekly exam data sync

            Auto-detected changes via Tavily + Groq LLM.
            See PR description for full change log.
          branch: auto/weekly-exam-update
          base: dev
          title: '🔄 Weekly Exam Data Update'
          body-path: /tmp/pr-body.md
          labels: |
            automated
            data-update
            needs-review

      # ── 7. No-op summary if nothing changed ──────────────────────────────────
      - name: No changes summary
        if: steps.diff.outputs.changed == 'false'
        run: echo "✅ All exam data is up to date. No PR needed this week."
