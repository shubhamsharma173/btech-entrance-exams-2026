name: Exam data review proposals

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      exam:
        description: 'Optional exact active exam name; empty uses the rotating selection and discovery scan'
        required: false
        type: string
      dry_run:
        description: 'Print the report to the uploaded log without writing a review JSON file'
        required: false
        default: false
        type: boolean

# This workflow only reads the repository and uploads unverified review artifacts.
# It cannot publish data, open a PR, or mark any field verified. Enable it only
# after configuring service keys and reviewing their usage limits.
permissions:
  contents: read

concurrency:
  group: exam-data-review
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dataset structure
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run offline tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Collect unverified proposals
        id: review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REVIEW_EXAM: ${{ inputs.exam }}
          REVIEW_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -o pipefail
          args=()
          if [[ -n "$REVIEW_EXAM" ]]; then args+=(--exam "$REVIEW_EXAM"); fi
          if [[ "$REVIEW_DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          node scripts/update-exams.mjs "${args[@]}" 2>&1 | tee updater-run.log

      - name: Preserve review report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-data-review-${{ github.run_id }}
          path: |
            scripts/.last-update-review.json
            updater-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Explain review outcome
        if: always()
        shell: bash
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          {
            echo '## Exam data review'
            echo "Collection outcome: ${REVIEW_OUTCOME:-not run}."
            echo 'Published data was not changed. No claim of data freshness is made.'
            echo 'Download the artifact to inspect proposals, new-exam candidates and errors, including partial results from failed runs.'
            echo 'A reviewer must open each official source, check the cycle and every session, then edit data and field-level verification records in a separate reviewed change.'
          } >> "$GITHUB_STEP_SUMMARY"
