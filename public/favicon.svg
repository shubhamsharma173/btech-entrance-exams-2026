<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3B82F6"/>

  <!-- Graduation cap -->
  <g fill="#FFFFFF">
    <!-- Cap board -->
    <path d="M 50 35 L 25 45 L 25 50 L 50 60 L 75 50 L 75 45 Z"/>

    <!-- Cap base -->
    <rect x="45" y="50" width="10" height="20" rx="1"/>

    <!-- Tassel -->
    <circle cx="50" cy="73" r="3"/>
    <line x1="50" y1="70" x2="50" y2="65" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- "26" text on cap -->
    <text x="50" y="52" font-size="10" font-weight="bold" text-anchor="middle" fill="#3B82F6">26</text>
  </g>
</svg>
